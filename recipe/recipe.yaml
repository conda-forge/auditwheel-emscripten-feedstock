# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.3"
  python_min: "3.12"
  python_check_max: "3.14"

package:
  name: auditwheel-emscripten
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/auditwheel-emscripten/auditwheel_emscripten-${{ version }}.tar.gz
  sha256: 022a1526e549f9365aab5ca52402d54756c4ff57f0fd88f56548c329f91740b1

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - leb128
    - packaging
    - pyodide-cli >=0.4
    - python >=${{ python_min }}
    - wheel

tests:
  - python:
      imports: auditwheel_emscripten
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pyodide auditwheel --help

about:
  summary: auditwheel-like tool for Pyodide
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/auditwheel-emscripten
  repository: https://github.com/pyodide/auditwheel-emscripten

extra:
  recipe-maintainers:
    - bollwyvl
    - agriyakhetarpal
